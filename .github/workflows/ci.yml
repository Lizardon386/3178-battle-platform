name: ci

# 日常门禁：每次推送和 PR 都跑全量测试与接缝闸门。
# 两个平台都跑：行尾、路径、信号这类问题可能只在其中一个平台出现。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 协议互解测试要调 python，不依赖 runner 镜像自带的版本
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 原生端只在 Windows runner 构建；.NET 10 SDK 由 CI 提供，开发机不强制安装
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # verify = 构建引用 / lock / 生成物 / 全量测试 / 依赖边界
      - run: npm run verify
      - name: Seam gate
        shell: bash
        run: bash tools/checks/check-seam.sh
      # 仓外临时工程装 tarball 并真实构建 .bpkg，防止 workspace link 掩盖打包问题
      - name: External package smoke
        run: npm run smoke:package
      # C# Supervisor 真实拉起 Node Service 并经命名管道访问；只在 Windows 跑
      - name: Native supervisor smoke (win-x64)
        if: runner.os == 'Windows'
        run: npm run smoke:supervisor
      - name: Native package (win-x64)
        if: runner.os == 'Windows'
        run: npm run pack:win
      - name: Upload native package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: 3178-win-x64
          path: dist-win/3178
          retention-days: 14
