name: ci

# 日常门禁：每次推送和 PR 都跑全量测试与接缝闸门。
# 两个平台都跑：行尾、路径、信号这类问题可能只在其中一个平台出现。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 协议互解测试要调 python，不依赖 runner 镜像自带的版本
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 原生端只在 Windows runner 构建；.NET 10 SDK 由 CI 提供，开发机不强制安装
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # verify = 构建引用 / lock / 生成物 / 全量测试 / 依赖边界
      - run: npm run verify
      - name: Seam gate
        shell: bash
        run: bash tools/checks/check-seam.sh
      # 仓外临时工程装 tarball 并真实构建 .bpkg，防止 workspace link 掩盖打包问题
      - name: External package smoke
        run: npm run smoke:package
      # 真实 Chrome 打开管理端与游戏页；ubuntu runner 自带 Chrome
      - name: Browser smoke (ubuntu)
        if: runner.os == 'Linux'
        run: npm run smoke:web
      # C# Supervisor 真实拉起 Node Service 并经命名管道访问；只在 Windows 跑
      - name: Native supervisor smoke (win-x64)
        if: runner.os == 'Windows'
        run: npm run smoke:supervisor
      - name: Supervisor unit tests (win)
        if: runner.os == 'Windows'
        run: npm run test:supervisor
      - name: Native package (win-x64)
        if: runner.os == 'Windows'
        run: npm run pack:win
      - name: Upload native package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: 3178-win-x64
          path: dist-win/3178
          retention-days: 14
      # 安装器只在 CI 构建；本机未装 Inno Setup，不冒充本机验收
      - name: Build installer (win-x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tools\packaging\inno\setup.iss
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: 3178-setup-win-x64
          path: dist-win/3178-setup-*.exe
          retention-days: 14
      # 静默安装 → 跑打包后的 Supervisor → 静默卸载；真实安装目录，不是解压目录
      - name: Install/uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-win/3178-setup-*.exe | Select-Object -First 1
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\3178'
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          if (-not (Test-Path (Join-Path $appDir '3178.exe'))) { throw '安装后找不到 3178.exe' }
          if (-not (Test-Path (Join-Path $appDir 'unins000.exe'))) { throw '安装后找不到卸载器' }

          # 用户数据在安装目录之外；重装（同 AppId 升级）必须保留
          $dataRoot = Join-Path $env:LOCALAPPDATA '3178-battle-platform\data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot 'upgrade-marker.txt'
          Set-Content -Path $marker -Value 'keep-me' -Encoding utf8
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          if (-not (Test-Path (Join-Path $appDir '3178.exe'))) { throw '升级后找不到 3178.exe' }
          if (-not (Test-Path $marker)) { throw '升级后用户数据标记丢失' }

          $env:BP_PACKAGED_APP = '1'
          $env:BP_SUPERVISOR_EXE = Join-Path $appDir 'bp-supervisor.exe'
          npm run smoke:supervisor

          $uninstaller = Join-Path $appDir 'unins000.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path (Join-Path $appDir '3178.exe')) { throw '卸载后 3178.exe 仍存在' }
          if (-not (Test-Path $marker)) { throw '卸载后用户数据标记丢失' }
          Remove-Item -Path $marker -Force
